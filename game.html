<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Masurkewitsch — Portfolio</title>
    <meta name="description" content="game">

    <!-- Google Fonts: Serif für Überschriften, Sans für Text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= NAVIGATION ================= -->
<header class="site-header">
    <a href="#top" class="logo">Simon Masurkewitsch</a>
    <nav class="main-nav">
        <a href="index.html">Start</a>
        <a href="game.html">Game</a>
        <a href="projekte.html">Projekte</a>
        <a href="uebermich.html">Über mich</a>
        <a href="kontakt.html">Kontakt</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Menü öffnen" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
</header>

<section class="game">

    <!-- FREIFLIEGENDER SPIELTITEL (Wird via CSS & Script animiert) -->
    <h1 id="game-title" class="state-title">Simon Masurkewitsch</h1>

    <!-- TITELBILDSCHIRM -->
    <div id="title-screen" class="screen active-screen">
        <h2>Das spielerische Kennenlernen</h2>
        <div class="blink-text">- Klicke, um zu beginnen -</div>
    </div>

    <!-- HAUPTMENÜ -->
    <div id="main-menu" class="screen">
        <button id="start-game-btn" class="menu-btn">Neues Spiel</button>
        <button id="load-game-btn" class="menu-btn">Spiel laden</button>
        <button id="option-btn" class="menu-btn">Optionen</button>
        <button id="credits-btn" class="menu-btn">Credits</button>

        <img src="_assets/vn_assets/images/me_titlescreen.png" id="menu-char-img" alt="Simon">
    </div>

    <!-- OPTIONEN -->
    <div id="option-screen" class="screen">
        <h1>Spiel-Optionen</h1>
        <input type="range" id="volume" min="0" max="100" step="1" value="100">
        <label for="volume">Volume</label>
        <input type="range" id="textspeed" min="0" max="100" step="1" value="100">
        <label for="textspeed">Text-Geschwindigkeit</label>
        <div id="back-buttons" class="back-buttons">
            <button id="backToGame" class="menu-btn">Zurück zum Spiel</button>
            <button id="backToMenu" class="menu-btn">Zurück zum Hauptmenü</button>
        </div>
    </div>

    <!-- SPIEL-FENSTER -->
    <div id="game-container" class="screen">
        <div id="game-controls">
            <button id="save-btn" class="control-btn">💾</button>
            <button id="game-option-btn" class="control-btn">⚙️</button>
            <button id="menu-btn" class="control-btn">Menü</button>
        </div>
        <div id="character-container">
            <img id="sprite-0" class="character-sprite" alt="">
            <img id="sprite-1" class="character-sprite" alt="">
            <img id="sprite-2" class="character-sprite" alt="">
        </div>
        <div id="drink-button">
            <button id="drink-btn" class="drink-btn" style="display: none;">🥤</button>
            <button id="quest-btn" class="drink-btn" style="display: none;">Fragen</button>
        </div>
        <div id="choicesP">
            <div id="choices-box"></div>
        </div>
        <div id="dialogue-box">
            <div id="speaker-name"></div>
            <div id="story-text">Lade Spiel...</div>
        </div>
    </div>

    <script>
        // -- SCREEN MANAGEMENT --
        const titleScreen = document.getElementById('title-screen');
        const mainMenu = document.getElementById('main-menu');
        const optionScreen = document.getElementById('option-screen');
        const gameContainer = document.getElementById('game-container');
        const loadGameBtn = document.getElementById('load-game-btn');
        const optionsBtn = document.getElementById('option-btn');
        const gameOptionBtn = document.getElementById('game-option-btn');
        const drinkBtn = document.getElementById('drink-btn');
        const questBtn = document.getElementById('quest-btn');
        const backToGameBtn = document.getElementById('backToGame');
        const backToMenuBtn = document.getElementById('backToMenu');

        const bgmPlayer = new Audio();
        bgmPlayer.loop = true;
        bgmPlayer.volume = 0.3;
        let currentBgmSrc = "";

        let currentNodeId = 1;
        let nodeHistory = [];
        let isDrinkUnlocked = false;
        let isQuestUnlocked = false;
        let previousScreen = mainMenu;

        let typewriterInterval = null;
        let isTyping = false;
        let currentFullText = "";
        let typingSpeed = 30;
        let autoNodeTimeout = null;

        const gameTitle = document.getElementById('game-title');

        function switchScreen(screenToHide, screenToShow) {
            screenToHide.classList.remove('active-screen');
            screenToShow.classList.add('active-screen');

            if (screenToShow === titleScreen) {
                gameTitle.className = 'state-title';
            } else if (screenToShow === mainMenu || screenToShow === optionScreen) {
                gameTitle.className = 'state-menu';
            } else {
                gameTitle.className = 'state-hidden';
            }

            if (screenToShow === mainMenu) {
                checkSaveState();
                updateBgm('_assets/vn_assets/music/menubg.mp3');
            }
        }

        function updateBgm(bgmPath) {
            if (!bgmPath) return;

            if (bgmPath === "stop") {
                bgmPlayer.pause();
                currentBgmSrc = "";
                return;
            }

            if (bgmPath !== currentBgmSrc) {
                currentBgmSrc = bgmPath;
                bgmPlayer.src = bgmPath;

                bgmPlayer.play().catch(err => {
                    console.log("Autoplay verhindert oder Datei nicht gefunden:", err);
                });
            }
        }

        function preloadImages(imageUrls) {
            imageUrls.forEach(url => {
                const img = new Image();
                img.src = url;
            });
        }

        preloadImages([
            "_assets/vn_assets/images/entrance.jpg",
            "_assets/vn_assets/images/me_titlescreen.png",
            "_assets/vn_assets/images/me_comein.png",
            "_assets/vn_assets/images/me_welcome.png",
            "_assets/vn_assets/images/me_hello.png",
            "_assets/vn_assets/images/couch_explaining_1.jpg",
            "_assets/vn_assets/images/couch_explaining_2.jpg",
            "_assets/vn_assets/images/couch_explaining_3.jpg",
            "_assets/vn_assets/images/couch_explaining_4.jpg",
            "_assets/vn_assets/images/couch_explaining_5.jpg",
            "_assets/vn_assets/images/couch_explaining_6.jpg",
            "_assets/vn_assets/images/couch_friendly_1.jpg",
            "_assets/vn_assets/images/couch_friendly_2.jpg",
            "_assets/vn_assets/images/couch_friendly_3.jpg",
            "_assets/vn_assets/images/couch_friendly_4.jpg",
            "_assets/vn_assets/images/couch_friendly_5.jpg",
            "_assets/vn_assets/images/couch_friendly_6.jpg",
            "_assets/vn_assets/images/couch_pointing.jpg",
            "_assets/vn_assets/images/couch_question_1.jpg",
            "_assets/vn_assets/images/couch_serious_1.jpg",
            "_assets/vn_assets/images/couch_tea.jpg",
            "_assets/vn_assets/images/couch_thinking_1.jpg",
            "_assets/vn_assets/images/couch_thinking_2.jpg",
            "_assets/vn_assets/images/couch_thinking_3.jpg",
            "_assets/vn_assets/images/couch_water.jpg",
            "_assets/vn_assets/images/couch_whisper.jpg"
        ]);

        function typeWriter(text, onComplete) {
            clearInterval(typewriterInterval);
            storyTextElement.textContent = "";
            currentFullText = text;
            isTyping = true;

            let index = 0;
            typewriterInterval = setInterval(() => {
                if (index <= text.length) {
                    storyTextElement.textContent = text.slice(0, index);
                    index++;
                } else {
                    clearInterval(typewriterInterval);
                    isTyping = false;
                    if (onComplete) onComplete();
                }
            }, typingSpeed);
        }

        function checkSaveState() {
            const savedNode = localStorage.getItem('vn_save_node');
            if (loadGameBtn) loadGameBtn.disabled = !savedNode;
        }

        titleScreen.addEventListener('click', () => {
            switchScreen(titleScreen, mainMenu);
        });

        function scheduleAutoAdvance(delay) {
            clearTimeout(autoNodeTimeout);
            autoNodeTimeout = setTimeout(() => {
                const node = storyNodes.find(n => n.id === currentNodeId);
                if (node && node.nextNode !== undefined) {
                    showNode(node.nextNode);
                }
            }, delay);
        }

        // --- OPTIONEN & REGLER ---
        const volumeSlider = document.getElementById('volume');
        const textSpeedSlider = document.getElementById('textspeed');

        const savedVolume = localStorage.getItem('vn_volume');
        if (savedVolume !== null) {
            bgmPlayer.volume = parseFloat(savedVolume) / 100;
        }

        const savedSpeed = localStorage.getItem('vn_textspeed');
        if (savedSpeed !== null) {
            typingSpeed = 105 - parseInt(savedSpeed);
        }

        if (volumeSlider && textSpeedSlider) {
            volumeSlider.value = bgmPlayer.volume * 100;
            textSpeedSlider.value = 105 - typingSpeed;

            volumeSlider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                bgmPlayer.volume = val / 100;
                localStorage.setItem('vn_volume', val);
            });

            textSpeedSlider.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                typingSpeed = 105 - val;
                localStorage.setItem('vn_textspeed', val);
            });
        }

        const mainOptionBtn = document.getElementById('main-option-btn') || optionsBtn;
        if (mainOptionBtn) {
            mainOptionBtn.addEventListener('click', () => {
                previousScreen = mainMenu;
                if (backToGameBtn) backToGameBtn.disabled = true;
                switchScreen(mainMenu, optionScreen);
            });
        }

        if (gameOptionBtn) {
            gameOptionBtn.addEventListener('click', () => {
                previousScreen = gameContainer;
                if (backToGameBtn) backToGameBtn.disabled = false;
                switchScreen(gameContainer, optionScreen);
            });
        }

        if (backToGameBtn) {
            backToGameBtn.addEventListener('click', () => {
                switchScreen(optionScreen, gameContainer);
            });
        }

        if (backToMenuBtn) {
            backToMenuBtn.addEventListener('click', () => {
                if (previousScreen === gameContainer) {
                    const confirmLeave = confirm("Möchtest du wirklich zum Hauptmenü zurückkehren? Ungespeicherter Fortschritt geht verloren.");
                    if (!confirmLeave) return;
                }
                switchScreen(optionScreen, mainMenu);
            });
        }

        // --- MENÜ BUTTONS ---
        document.getElementById('start-game-btn').addEventListener('click', () => {
            playerName = 'Du';
            isFormal = false;
            isQuestUnlocked = false;
            isDrinkUnlocked = false;
            currentNodeId = null;
            nodeHistory = [];

            switchScreen(mainMenu, gameContainer);
            showNode(1);
        });

        if (loadGameBtn) {
            loadGameBtn.addEventListener('click', () => {
                const savedNode = localStorage.getItem('vn_save_node');
                if (savedNode) {
                    switchScreen(mainMenu, gameContainer);
                    showNode(parseInt(savedNode));
                }
            });
        }

        document.getElementById('credits-btn').addEventListener('click', () => {
            alert("Programmiert und geschrieben von Simon Masurkewitsch!");
        });

        document.getElementById('save-btn').addEventListener('click', () => {
            localStorage.setItem('vn_save_node', currentNodeId);
            alert("Spielstand erfolgreich gespeichert!");
        });

        document.getElementById('menu-btn').addEventListener('click', () => {
            const confirmLeave = confirm("Möchtest du wirklich zum Hauptmenü zurückkehren?");
            if (confirmLeave) {
                switchScreen(gameContainer, mainMenu);
            }
        });



        // In-Game Spezial-Buttons
        drinkBtn.addEventListener('click', () => {
            saveDrinkNode = currentNodeId;
            showNode(8000000);
        });

        questBtn.addEventListener('click', () => {
            showNode(99999);
        });


        // --- SPIELELOGIK ---
        const speakerNameElement = document.getElementById('speaker-name');
        const storyTextElement = document.getElementById('story-text');
        const choicesBoxElement = document.getElementById('choices-box');
        const dialogueBoxElement = document.getElementById('dialogue-box');

        let playerName = 'Du';
        let isFormal = false;
        let saveDrinkNode = 16;


        const storyNodes = [
            // INTRO
            {
                id: 1,
                speaker: "Simon",

                    { position: "center", img: "_assets/vn_assets/images/me_hello.png" }
                ],
                bgm: "_assets/vn_assets/music/maintheme.mp3",
                nextNode: 9000000
            },
            {
                id: 9000000,
                speaker: "Simon",
                text: "Bevor wir starten, welche Anrede wäre angenehm?",
                bg: "_assets/vn_assets/images/entrance.jpg",
                characters: [
                    { position: "center", img: "_assets/vn_assets/images/me_welcome.png" }
                ],
                nextNode: 9000001
            },
            {
                id: 9000001,
                speaker: "Simon",
                text: "Bevor wir starten, welche Anrede wäre angenehm?",
                instantText: true,
                bg: "_assets/vn_assets/images/entrance.jpg",
                characters: [
                    { position: "right", img: "_assets/vn_assets/images/me_welcome.png" }
                ],
                choices: [
                    { text: "Ich würde gerne gesiezt werden, danke.", nextNode: 2, setFormal: true },
                    { text: "Duzen ist für mich in Ordnung!", nextNode: 2, setFormal: false }
                ]
            },
            {
                id: 2,
                speaker: "Simon",
                fontStyle: "normal",
                text: "{Sie sind|Du bist} also hier um mich kennenzulernen. {Kommen Sie|Komm} doch erst einmal herein!",
                bg: "_assets/vn_assets/images/entrance.jpg",
                characters: [
                    { position: "left", img: "_assets/vn_assets/images/me_comein.png" }
                ],
                nextNode: 6000000
            },
            {
                id: 6000000,
                bg: "#000000",
                autoAdvance: 1000,
                nextNode: 3
            },
            {
                id: 3,
                speaker: "Simon",
                fontStyle: "normal",
                text: "Hier wären wir! Drinnen ist man ungestörter, hier kann man besser reden.",

            {
                id: 7,
                speaker: "Simon",

            {

        // --- DIALOG-STEUERUNGSFUNKTIONEN (AUSSEN) ---
        function advanceDialogue() {
            clearTimeout(autoNodeTimeout);
            const node = storyNodes.find(n => n.id === currentNodeId);
            if (isTyping) {
                clearInterval(typewriterInterval);
                storyTextElement.textContent = currentFullText;
                isTyping = false;

                if (node && node.autoAdvance) {
                    scheduleAutoAdvance(node.autoAdvance);
                }
            } else if (node && node.nextNode !== undefined) {
                showNode(node.nextNode);
            }
        }

        function regressDialogue() {
            if (nodeHistory.length > 0) {
                const prevNodeId = nodeHistory.pop();
                showNode(prevNodeId, true);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;

            if (!gameContainer.classList.contains('active-screen')) return;

            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.key === 'ArrowRight') {
                advanceDialogue();
            } else if (e.key === 'ArrowLeft') {
                regressDialogue();
            }
        });

        // --- SHOW NODE FUNKTION ---
        function showNode(nodeIndex, isBackNavigation = false) {
            clearTimeout(autoNodeTimeout);
            if (nodeIndex === 'menu') {
                nodeHistory = [];
                switchScreen(gameContainer, mainMenu);
                return;
            }

            const node = storyNodes.find(n => n.id === nodeIndex);
            if (!node) return;

            if (!isBackNavigation && currentNodeId && currentNodeId !== nodeIndex) {
                nodeHistory.push(currentNodeId);
            }

            currentNodeId = nodeIndex;

            updateBgm(node.bgm);

            for (let i = 0; i < 3; i++) {
                const spriteEl = document.getElementById(`sprite-${i}`);
                if (spriteEl) {
                    spriteEl.classList.remove('active', 'pos-left', 'pos-center', 'pos-right', 'anim-bounce', 'anim-shake', 'dimmed');
                }
            }

            if (node.characters && Array.isArray(node.characters)) {
                node.characters.forEach((char, index) => {
                    const spriteEl = document.getElementById(`sprite-${index}`);
                    if (spriteEl) {
                        if (spriteEl.dataset.currentImg !== char.img) {
                            spriteEl.src = char.img;
                            spriteEl.dataset.currentImg = char.img;
                        }

                        spriteEl.classList.add(`pos-${char.position}`);
                        spriteEl.classList.add('active');

                        if (node.speaker && char.name && char.name !== node.speaker) {
                            spriteEl.classList.add('dimmed');
                        }

                        if (char.action) {
                            void spriteEl.offsetWidth;
                            spriteEl.classList.add(`anim-${char.action}`);
                        }
                    }
                });
            }

            // Trinken-Button
            isDrinkUnlocked = (node.id >= 14 && node.id < 5000000);
            drinkBtn.style.display = isDrinkUnlocked ? "inline-block" : "none";

            // Quest-Button
            if (node.id === 19) {
                isQuestUnlocked = true;
            }

            if (isQuestUnlocked && node.id !== 99999) {
                questBtn.style.display = "inline-block";
            } else {
                questBtn.style.display = "none";
            }

            while (choicesBoxElement.firstChild) {
                choicesBoxElement.removeChild(choicesBoxElement.firstChild);
            }

            // Text verarbeiten
            let currentSpeaker = node.speaker || "";
            let currentText = node.text || "";

            currentSpeaker = currentSpeaker.replace("{playerName}", playerName);
            currentText = currentText.replace("{playerName}", playerName);

            currentText = currentText.replace(/\{([^}]+)\|([^}]+)\}/g, (match, formalText, informalText) => {
                return isFormal ? formalText : informalText;
            });

            speakerNameElement.innerText = currentSpeaker;

            if (node.instantText) {
                clearInterval(typewriterInterval);
                isTyping = false;
                currentFullText = currentText;
                storyTextElement.textContent = currentText;

                if (node.autoAdvance) {
                    scheduleAutoAdvance(node.autoAdvance);
                }
            } else {
                typeWriter(currentText, () => {
                    if (node.autoAdvance) {
                        scheduleAutoAdvance(node.autoAdvance);
                    }
                });
            }

            if (node.bg) {
                if (node.bg.startsWith('#') || node.bg.startsWith('rgb')) {
                    gameContainer.style.backgroundImage = 'none';
                    gameContainer.style.backgroundColor = node.bg;
                } else {
                    gameContainer.style.backgroundImage = `url("${node.bg}")`;
                    gameContainer.style.backgroundSize = node.bgSize || "cover";
                    gameContainer.style.backgroundPosition = node.bgPosition || "center";
                    gameContainer.style.backgroundRepeat = "no-repeat";
                }
            }

            if (node.fontStyle) {
                gameContainer.style.fontStyle = node.fontStyle;
            }

            if (node.inputType) {
                let inputField = document.createElement("input");
                inputField.type = node.inputType;
                inputField.id = "gameInput";

                let rawPlaceholder = node.inputPlaceholder || "Gib deine Antwort ein...";
                inputField.placeholder = rawPlaceholder.replace(/\{([^}]+)\|([^}]+)\}/g, (match, formalText, informalText) => {
                    return isFormal ? formalText : informalText;
                });

                choicesBoxElement.appendChild(inputField);
            }

            dialogueBoxElement.onclick = advanceDialogue;

            if (node.nextNode !== undefined) {
                dialogueBoxElement.style.cursor = "pointer";
            } else {
                dialogueBoxElement.style.cursor = "default";
            }

            // Choices verarbeiten
            if (node.choices) {
                node.choices.forEach(choice => {
                    const button = document.createElement('button');

                    let choiceText = choice.text.replace(/\{([^}]+)\|([^}]+)\}/g, (match, formalText, informalText) => {
                        return isFormal ? formalText : informalText;
                    });
                    button.innerText = choiceText;
                    button.classList.add('choice-btn');

                    button.addEventListener('click', () => {
                        if (choice.setFormal !== undefined) {
                            isFormal = choice.setFormal;
                        }

                        let targetNode = choice.nextNode;

                        if (node.inputType && choice.requireInput) {
                            let inputElement = document.getElementById("gameInput");
                            let inputValue = inputElement ? inputElement.value.trim() : "";

                            if (inputValue === "") {
                                alert("Bitte gib etwas in das Feld ein!");
                                inputElement.focus();
                                return;
                            }

                            if (node.keywords) {
                                let userInput = inputValue.toLowerCase();
                                let matchedNode = null;

                                for (let item of node.keywords) {
                                    let match = item.words.some(word => userInput.includes(word.toLowerCase()));
                                    if (match) {
                                        matchedNode = item.nextNode;
                                        break;
                                    }
                                }

                                if (matchedNode) {
                                    targetNode = matchedNode;
                                } else if (node.fallbackNode !== undefined) {
                                    targetNode = node.fallbackNode;
                                }
                            }
                            else {
                                playerName = inputValue;
                            }

                        }
                        else if (choice.resetName !== undefined) {
                            playerName = choice.resetName.replace(/\{([^}]+)\|([^}]+)\}/g, (match, formalText, informalText) => {
                                return isFormal ? formalText : informalText;
                            });
                        }
                        showNode(targetNode);
                    });

                    choicesBoxElement.appendChild(button);
                });
            }
        }

        checkSaveState();
    </script>
